<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perso XXL Dashboard</title>
    <link rel="icon" href="../landing/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
      (function () {
        const key = "perso-dashboard-theme";
        const stored = localStorage.getItem(key);
        const theme = stored === "dark" || stored === "light"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      }());
    </script>
  </head>
  <body>
    <nav class="dashboard-nav" aria-label="Dashboard">
      <div class="nav-logo">
        <img src="../landing/favicon.svg" width="36" height="36" alt="" class="nav-logo-mark">
        <span class="nav-logo-text">Perso<span>XXL</span></span>
      </div>
      <div class="nav-actions">
        <button type="button" id="theme-toggle" class="btn btn-ghost btn-sm btn-icon" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.75"/>
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 14.5A7.5 7.5 0 0 1 9.5 4 6 6 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" id="refresh-btn" class="btn btn-primary btn-sm">Refresh</button>
      </div>
    </nav>

    <main class="dashboard-shell">
      <header class="dashboard-header">
        <p class="dashboard-eyebrow">Your modifications</p>
        <h1>Dashboard</h1>
      </header>

      <section class="summary-grid" aria-label="Summary">
        <div class="summary-card">
          <span id="site-count">0</span>
          <p>Modified pages</p>
        </div>
        <div class="summary-card">
          <span id="mod-count">0</span>
          <p>Total modifications</p>
        </div>
        <div class="summary-card">
          <span id="active-count">0</span>
          <p>Active modifications</p>
        </div>
      </section>

      <section class="toolbar" aria-label="Filters">
        <input id="search-input" type="search" placeholder="Search pages, prompts, or rules">
      </section>

      <section id="site-list" class="site-list" aria-live="polite"></section>
      <p id="empty-state" class="empty-state" hidden>No modified pages yet.</p>
    </main>

    <script src="mock-data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
