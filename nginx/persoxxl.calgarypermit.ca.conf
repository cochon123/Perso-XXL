# Install to /etc/nginx/sites-available/ then symlink sites-enabled.
# Replace SSL paths after: certbot certonly --nginx -d persoxxl.calgarypermit.ca
# DNS: A record persoxxl -> 187.124.144.206 (hostnames are case-insensitive).

server {
    listen 80;
    listen [::]:80;
    server_name persoxxl.calgarypermit.ca PersoXXL.calgarypermit.ca;

    root /var/www/persoxxl/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /chat-interface/ {
        alias /var/www/persoxxl/chat-interface/;
        try_files $uri =404;
    }

    # Cache static assets
    location ~* \.(svg|png|jpg|jpeg|webp|gif|css|js|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

